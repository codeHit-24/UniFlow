<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Admin Dashboard - UniFlow</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

    <h2>UniFlow</h2>
<div>

    <button onclick="logout()">Logout</button>

</div>

</nav>


<div class="container">

    <div class="page-title">

        <h1>Admin Dashboard</h1>

        <p>
            Manage students, courses, and enrollments.
        </p>

    </div>


    <!-- Statistics -->

    <div class="stats-container">

        <div class="stat-card">

            <h2 id="studentCount">0</h2>

            <p>Total Students</p>

        </div>


        <div class="stat-card">

            <h2 id="courseCount">0</h2>

            <p>Total Courses</p>

        </div>


        <div class="stat-card">

            <h2 id="enrollmentCount">0</h2>

            <p>Total Enrollments</p>

        </div>

    </div>


    <!-- Management -->

    <div class="dashboard">

        <a href="index.html"
           class="dashboard-card">

            <h3>Students</h3>

            <p>
                Manage student records
            </p>

        </a>


        <a href="courses.html"
           class="dashboard-card">

            <h3>Courses</h3>

            <p>
                Manage university courses
            </p>

        </a>


        <a href="enrollments.html"
           class="dashboard-card">

            <h3>Enrollments</h3>

            <p>
                Manage course enrollments
            </p>

        </a>

    </div>

</div>


<script src="dashboard.js"></script>

</body>

</html>
