<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Courses - UniFlow</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

    <h2>UniFlow</h2>

    <button
            type="button"
            onclick="logout()">
        Logout
    </button>

</nav>


<div class="container">

    <div class="page-title">

        <h1>My Courses</h1>

        <p>
            Courses assigned to you.
        </p>

    </div>


    <div id="courseContainer">

        <div class="empty-message">

            <h3>Loading courses...</h3>

            <p>
                Please wait while your courses are loaded.
            </p>

        </div>

    </div>


    <div style="margin-top: 25px;">

        <button
                type="button"
                onclick="goBack()">
            Back to Dashboard
        </button>

    </div>

</div>


<script src="faculty-courses.js"></script>

</body>

</html>
