<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - UniFlow</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard-layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="sidebar-logo">
            Uni<span>Flow</span>
        </div>

        <nav class="sidebar-menu">

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="profile.html" class="active">
                My Profile
            </a>

            <a href="my-courses.html">
                My Courses
            </a>

        </nav>

        <div class="sidebar-bottom">

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </aside>


    <!-- Main Content -->

    <main class="dashboard-main">

        <!-- Top Bar -->

        <div class="dashboard-topbar">

            <div>

                <h2>My Profile</h2>

                <p class="dashboard-subtitle">
                    View your personal and academic information
                </p>

            </div>

            <div class="user-info">

                <span id="profileName">
                    Student
                </span>

            </div>

        </div>


        <!-- Page Heading -->

        <div class="page-title">

            <h1>
                Personal Information
            </h1>

            <p>
                Your registered student information.
            </p>

        </div>


        <!-- Profile -->

        <div class="profile-card">

            <div class="profile-row">

                <span class="profile-label">
                    First Name
                </span>

                <span
                        class="profile-value"
                        id="firstName"
                >
                    Loading...
                </span>

            </div>


            <div class="profile-row">

                <span class="profile-label">
                    Last Name
                </span>

                <span
                        class="profile-value"
                        id="lastName"
                >
                    Loading...
                </span>

            </div>


            <div class="profile-row">

                <span class="profile-label">
                    Email
                </span>

                <span
                        class="profile-value"
                        id="email"
                >
                    Loading...
                </span>

            </div>


            <div class="profile-row">

                <span class="profile-label">
                    Department
                </span>

                <span
                        class="profile-value"
                        id="department"
                >
                    Loading...
                </span>

            </div>


            <div class="profile-row">

                <span class="profile-label">
                    Semester
                </span>

                <span
                        class="profile-value"
                        id="semester"
                >
                    Loading...
                </span>

            </div>

        </div>


        <button
                class="back-button"
                onclick="goBack()"
        >
            Back to Dashboard
        </button>

    </main>

</div>


<script src="profile.js"></script>

</body>

</html>
