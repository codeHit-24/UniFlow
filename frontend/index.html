<!DOCTYPE html>
<html>

<head>

    <title>UniFlow ERP</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<h1 class="page-title" style="text-align:center;">
    UniFlow ERP
</h1>

<button onclick="logout()">Logout</button>


<h2 class="page-title">
    Student Management
</h2>

<nav>

    <a href="dashboard.html">Dashboard</a>

    <a href="index.html">Students</a>

    <a href="courses.html">Courses</a>

    <a href="enrollments.html">Enrollments</a>

</nav>

<div id="message"></div>

<div class="form-container">

    <h2 class="page-title">Add Student</h2>

    <input id="firstName" placeholder="First Name">

    <input id="lastName" placeholder="Last Name">

    <input id="email" placeholder="Email">

    <input id="department" placeholder="Department">

    <input id="semester" placeholder="Semester">

    <button id="saveBtn" onclick="saveStudent()">
        Save Student
    </button>

</div>

<div class="search-container">

    <input
            type="text"
            id="searchInput"
            placeholder="Search by name..."
            onkeyup="searchStudent()">

</div>

<div class="table-container">
<table>

    <thead>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
        <th>Semester</th>
        <th>Action</th>
    </tr>

    </thead>


    <tbody id="studentTable">

    </tbody>


</table>
</div>


<script src="script.js"></script>

<div id="toast"></div>

</body>

</html>
