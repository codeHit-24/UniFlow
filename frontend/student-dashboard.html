<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard - UniFlow</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard-layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="sidebar-logo">
            Uni<span>Flow</span>
        </div>

        <nav class="sidebar-menu">

            <a href="student-dashboard.html" class="active">
                Dashboard
            </a>

            <a href="profile.html">
                My Profile
            </a>

            <a href="my-courses.html">
                My Courses
            </a>

        </nav>

        <div class="sidebar-bottom">

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </aside>


    <!-- Main Content -->

    <main class="dashboard-main">

        <!-- Top Bar -->

        <div class="dashboard-topbar">

            <div>

                <h2>Student Dashboard</h2>

                <p class="dashboard-subtitle">
                    Overview of your academic information
                </p>

            </div>

            <div class="user-info">

                <span id="studentName">
                    Student
                </span>

            </div>

        </div>


        <!-- Page Heading -->

        <div class="page-title">

            <h1>
                Welcome back
            </h1>

            <p>
                Manage your profile and view your enrolled courses.
            </p>

        </div>


        <!-- Dashboard Cards -->

        <div class="student-dashboard-cards">

            <div
                    class="student-card"
                    onclick="window.location.href='profile.html'"
            >

                <div class="student-card-icon">
                    P
                </div>

                <div>

                    <h2>
                        My Profile
                    </h2>

                    <p>
                        View and manage your personal information.
                    </p>

                </div>

            </div>


            <div
                    class="student-card"
                    onclick="window.location.href='my-courses.html'"
            >

                <div class="student-card-icon">
                    C
                </div>

                <div>

                    <h2>
                        My Courses
                    </h2>

                    <p>
                        View the courses you are currently enrolled in.
                    </p>

                </div>

            </div>

        </div>

    </main>

</div>


<script src="student-dashboard.js"></script>

</body>

</html>
